# Per-module dart codegen for workflow.
version: v2
managed:
  enabled: true

plugins:
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: ../sdk/dart/workflow/lib/src
    include_imports: true
    include_wkt: true

  - remote: buf.build/connectrpc/dart:v2.0.0
    out: ../sdk/dart/workflow/lib/src
    include_imports: true
    include_wkt: true
